[build]
  command = "npm run build"
  publish = "dist"

# Proxy /api requests to external Python backend (set BACKEND_URL in Netlify Environment Variables)
# Example: https://your-python-backend.onrender.com
[[redirects]]
  from = "/api/*"
  to = ":BACKEND_URL/api/:splat"
  status = 200
  force = true

# SPA client-side routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
